name: picnique_rosary_healthcare_smartring
description: "Picnique B2G healthcare smart ring app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.2.0
  intl: ^0.20.2
  provider: ^6.1.5
  flutter_blue_plus: ^1.35.5
  # SDK snapshot supplied in the Picnique Inc. project.
  rwfit_ble:
    git:
      url: https://github.com/RWFitSDK/RW_flutter_plugin.git
      ref: be17a8f306e19aa3de2e306c044d94e5d76c691f
  url_launcher: ^6.0.0
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  path: ^1.9.1
  collection: ^1.19.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.0.0
  flutter_markdown: ^0.7.7
  markdown: ^7.3.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.6.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/legal/
  fonts:
    - family: Paperlogy
      fonts:
        - asset: lib/assets/fonts/Paperlogy-1Thin.ttf
          weight: 100
        - asset: lib/assets/fonts/Paperlogy-2ExtraLight.ttf
          weight: 200
        - asset: lib/assets/fonts/Paperlogy-3Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Paperlogy-5Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Paperlogy-6SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Paperlogy-7Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Paperlogy-8ExtraBold.ttf
          weight: 800
        - asset: lib/assets/fonts/Paperlogy-9Black.ttf
          weight: 900
